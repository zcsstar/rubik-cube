name: iOS Release (TestFlight)

# Build, sign, and upload an iOS release build to TestFlight. Triggered on
# a `v*-ios` git tag push (e.g. `v1.0.0-ios`) or manually via the Actions tab.
#
# Required repository secrets (Settings -> Secrets -> Actions):
#   APPSTORE_KEY_ID       - 10-char Key ID from App Store Connect > Integrations
#   APPSTORE_ISSUER_ID    - UUID Issuer ID from the same page
#   APPSTORE_PRIVATE_KEY  - entire contents of the AuthKey_*.p8 file
#   APPSTORE_TEAM_ID      - 10-char Team ID from developer.apple.com > Membership
#
# Apple-side prerequisites (one-time):
#   - Bundle ID com.cheez.cubist registered in developer.apple.com Identifiers
#   - App entry created in App Store Connect with that bundle ID
#   - API key has App Manager role or higher
#
# No signing certificates or provisioning profiles are stored in the repo --
# xcodebuild's -allowProvisioningUpdates + API key auth makes Apple
# auto-create both on first run and reuse them on every subsequent run.

on:
  push:
    tags:
      - 'v*-ios'
  workflow_dispatch:
    inputs:
      version:
        description: 'MARKETING_VERSION (e.g. 1.0.0) — only needed when not triggered by a tag'
        required: false

jobs:
  release:
    # macos-26 ships Xcode 26 + the iOS 26 SDK, which Apple now requires for
    # all App Store submissions. macos-15 (Xcode 16.x) gets rejected at the
    # upload validation step with "must be built with the iOS 26 SDK".
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select latest stable (non-beta) Xcode
        # macos-26 ships every Xcode 26.x including unreleased seeds. The
        # directory name "Xcode_26.5.0.app" looks like a stable release but
        # its binary build version 17F5022i ends in a lowercase letter,
        # which is Apple's beta-seed marker -- App Store Connect rejects
        # uploads from such builds with error 90534.
        # Iterate highest-to-lowest, run `xcodebuild -version`, take the
        # first Xcode whose build number ends in a digit (i.e. a release).
        run: |
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app 2>/dev/null
          PICKED=
          for app in $(ls -d /Applications/Xcode_*.app 2>/dev/null \
                         | grep -viE 'beta|rc' \
                         | sort -Vr); do
            build=$(DEVELOPER_DIR="$app/Contents/Developer" \
                    xcodebuild -version 2>/dev/null \
                    | awk '/Build version/ {print $3}')
            echo "  $app -> build $build"
            if echo "$build" | grep -qE '[0-9]$'; then
              PICKED="$app"
              break
            fi
          done
          if [ -z "$PICKED" ]; then
            echo "No stable Xcode found; falling back to whatever sort -V picks"
            PICKED=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
                      | grep -viE 'beta|rc' \
                      | sort -V | tail -1)
          fi
          echo "Selecting: $PICKED"
          sudo xcode-select -s "$PICKED/Contents/Developer"
          xcodebuild -version

      - name: Install iOS platform support
        # Xcode 26 ships with the iOS 26 SDK but the macos-26 runner image
        # doesn't always have the iOS platform support files for storyboard
        # compilation pre-installed (we saw "iOS 26.5 Platform Not Installed"
        # at archive time without this step). Download them once before any
        # iOS-targeted action.
        run: |
          xcodebuild -downloadPlatform iOS -quiet || \
          xcodebuild -downloadPlatform iOS

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle with prod ad units
        run: npm run build:prod-ads

      - name: Sync iOS native assets
        run: npx cap sync ios

      - name: Derive version + build number
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v*-ios ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            VERSION="${VERSION%-ios}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="1.0.0"
          fi
          # Build number derived from the GHA run number so it monotonically
          # increases without us hand-bumping. App Store requires that
          # CFBundleVersion is unique + strictly increasing per upload.
          BUILD="${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Releasing version=$VERSION build=$BUILD"

      - name: Bump Xcode marketing + build version
        working-directory: ios/App
        run: |
          xcrun agvtool new-marketing-version "${{ steps.version.outputs.version }}"
          xcrun agvtool new-version -all "${{ steps.version.outputs.build }}"

      - name: Stage App Store Connect API key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          # xcodebuild looks for the .p8 either at a specified path or in one
          # of the known directories; we use the explicit-path mode for
          # clarity.
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          # Also stage the API key as JSON for fastlane sigh. We use Node
          # rather than a shell heredoc so the multi-line PEM newlines get
          # properly escaped to "\n" inside the JSON string.
          ASC_JSON=/tmp/asc_key.json
          # Env vars must come BEFORE the command, not after -- after the
          # command they're positional args to node, not env exports.
          OUT="$ASC_JSON" K="$APPSTORE_KEY_ID" I="$APPSTORE_ISSUER_ID" P="$APPSTORE_PRIVATE_KEY" \
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.env.OUT, JSON.stringify({
              key_id: process.env.K,
              issuer_id: process.env.I,
              key: process.env.P,
              in_house: false,
            }));
          '
          chmod 600 "$ASC_JSON"
          echo "ASC_JSON=$ASC_JSON" >> "$GITHUB_ENV"

      - name: Create + install distribution certificate
        env:
          APPSTORE_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          # The runner's login keychain has a non-empty password we don't
          # know, so we can't pre-authorise codesign access to keys that
          # land in it. Spin up a temporary keychain with a password we
          # generate, install fastlane cert's identity into THAT keychain,
          # and make it the default for the rest of the build.
          KEYCHAIN_PATH="$RUNNER_TEMP/cubist-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          # Add the new keychain to the user search list AHEAD of the login
          # keychain so codesign discovers our identity first.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS" >> "$GITHUB_ENV"

          # fastlane cert creates a new Apple Distribution certificate via
          # the App Store Connect API and imports both the cert and its
          # private key into the keychain we just created.
          # Note: Apple caps distribution certs at 3 per team. Revoke old
          # ones via the dev portal if we hit the cap.
          mkdir -p /tmp/certs
          fastlane cert \
            --development false \
            --team_id "$APPSTORE_TEAM_ID" \
            --api_key_path "$ASC_JSON" \
            --output_path /tmp/certs \
            --keychain_path "$KEYCHAIN_PATH" \
            --keychain_password "$KEYCHAIN_PASS"

          # Pre-authorise codesign + Apple tools to use the imported private
          # key without an interactive prompt -- this is the fix for the
          # ~58-minute codesign hang we hit on the previous run.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

      - name: Create + install distribution provisioning profile
        env:
          APPSTORE_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          # fastlane sigh creates (or downloads if it already exists) the
          # App Store distribution provisioning profile for our bundle ID,
          # then installs it under ~/Library/MobileDevice/Provisioning
          # Profiles/ where xcodebuild will pick it up.
          mkdir -p /tmp/profiles
          # `fastlane sigh` (Ruby) is preinstalled on macos-15 runners; no
          # `bundle exec` needed (we have no Gemfile in the repo).
          fastlane sigh \
            --app_identifier com.cheez.cubist \
            --team_id "$APPSTORE_TEAM_ID" \
            --api_key_path "$ASC_JSON" \
            --output_path /tmp/profiles \
            --filename Cubist_AppStore.mobileprovision \
            --skip_install false

          # Extract the profile name (an Apple-generated string like "iOS
          # Team Store Provisioning Profile: com.cheez.cubist") so we can
          # pass it to xcodebuild as PROVISIONING_PROFILE_SPECIFIER.
          PROFILE_PATH=/tmp/profiles/Cubist_AppStore.mobileprovision
          PROFILE_PLIST=$(security cms -D -i "$PROFILE_PATH")
          PROFILE_NAME=$(echo "$PROFILE_PLIST" | /usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin)
          PROFILE_UUID=$(echo "$PROFILE_PLIST" | /usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin)
          echo "Profile: $PROFILE_NAME ($PROFILE_UUID)"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive (Release configuration, generic iOS device)
        working-directory: ios/App
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          # Release target is configured for Manual signing in the pbxproj
          # (CODE_SIGN_STYLE=Manual, CODE_SIGN_IDENTITY=Apple Distribution).
          # With -allowProvisioningUpdates + the App Store Connect API key,
          # xcodebuild creates the distribution provisioning profile on
          # Apple's side on first run and reuses it after.
          # Debug target keeps Automatic style for local IDE builds.
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="$APPSTORE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export archive + upload to TestFlight
        working-directory: ios/App
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          # destination=upload tells xcodebuild to upload to App Store Connect
          # immediately after export, in a single step. signingStyle=manual
          # matches the Release config's CODE_SIGN_STYLE; with
          # -allowProvisioningUpdates xcodebuild discovers the freshly-created
          # distribution profile via the API key and signs the IPA with it.
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPSTORE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.cheez.cubist</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <!-- The GoogleMobileAds + UserMessagingPlatform xcframeworks
                 ship without dSYMs; uploading symbols triggers a warning
                 about missing UUIDs that can fail strict exports. We can
                 still get App Store crash symbolication for our own code;
                 the third-party SDK crashes will be partially symbolicated
                 by Google's own dSYMs registered in AdMob console. -->
            <key>uploadSymbols</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Upload xcarchive on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cubist-ios-xcarchive-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: ios/App/build/App.xcarchive
          if-no-files-found: warn
